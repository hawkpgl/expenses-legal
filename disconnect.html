<h1>Disconnect from QuickBooks</h1>
<p>To disconnect, the owner removes the app under QuickBooks Online: <em>Apps</em> &rarr; <em>My apps</em> (or <em>Settings</em> &rarr; <em>Manage apps</em>), and deletes the locally stored tokens. After this the tool has no access to any QuickBooks data.</p>
